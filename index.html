<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مهارات التواصل الفعّال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', Arial, sans-serif;
        }
        body {
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1a2b4a;
            border-bottom: 3px solid #2b7de9;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-size: 26px;
        }
        .question-block {
            background: #f9faff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 5px solid #2b7de9;
        }
        .question-text {
            font-weight: bold;
            font-size: 18px;
            color: #1e2f4e;
            margin-bottom: 12px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 10px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
        }
        .options label:hover {
            background: #eef4ff;
            border-color: #2b7de9;
        }
        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2b7de9;
        }
        .true-false {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .true-false label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 25px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }
        .true-false label:hover {
            background: #eef4ff;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #2b7de9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn:hover {
            background: #1a5bbf;
            transform: scale(1.02);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e8f4fd;
            border-radius: 12px;
            display: none;
            text-align: center;
        }
        .result.show {
            display: block;
        }
        .score {
            font-size: 28px;
            font-weight: bold;
            color: #1a2b4a;
        }
        .feedback {
            margin-top: 10px;
            font-size: 18px;
        }
        .correct-answer {
            background: #d4edda;
            border-color: #28a745;
        }
        .wrong-answer {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .small-note {
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 اختبار التواصل الفعّال</h1>
    <div id="quizForm"></div>
    <button class="btn" onclick="submitQuiz()">📊 عرض النتيجة</button>
    <div id="resultBox" class="result"></div>
    <div class="small-note">📍 الإجابات الصحيحة مضمنة في الكود - جرب بنفسك!</div>
</div>

<script>
    // ---------- بيانات الأسئلة والإجابات الصحيحة ----------
    const questions = [
        // الأسئلة 1-10 (اختيار من متعدد)
        {
            type: 'mcq',
            question: 'السؤال الأول: خلال اجتماع، قال أحد أعضاء الفريق: "هذه الفكرة لن تنجح إطلاقًا." لاحظت أن بقية الفريق صمتوا، ولم يعد أحد يشارك. ما الخطوة الأولى الأكثر فاعلية؟',
            options: ['أ) الدفاع عن الفكرة.', 'ب) تجاهل التعليق.', 'ج) سؤال المعترض عن الأسباب وطلب بدائل مع تشجيع بقية الفريق على المشاركة. ✅', 'د) الانتقال مباشرة إلى الموضوع التالي.'],
            correct: 2 // index 0-based
        },
        {
            type: 'mcq',
            question: 'السؤال الثاني: أثناء التدريب، أحد المشاركين يجيب عن جميع الأسئلة قبل الآخرين. بعد مرور 20 دقيقة بدأ المشاركون الآخرون في الانسحاب من النقاش. ما الخطأ الذي ارتكبه المدرب؟',
            options: ['أ) أعطى معلومات كثيرة.', 'ب) لم يدير ديناميكية المجموعة بشكل متوازن. ✅', 'ج) استخدم وسائل عرض كثيرة.', 'د) طرح أسئلة مفتوحة.'],
            correct: 1
        },
        {
            type: 'mcq',
            question: 'السؤال الثالث: قال المدير: "أحتاج التقرير بسرعة." الموظف أرسله الساعة الرابعة عصرًا. المدير كان يقصده خلال ساعة. أي عنصر فشل؟',
            options: ['أ) الرسالة.', 'ب) التغذية الراجعة.', 'ج) تحديد التوقعات. ✅', 'د) المرسل.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال الرابع: أحد المستفيدين يقول: "أنا بخير." لكنه: يتجنب التواصل البصري، يتحدث بصوت منخفض، يبدو متوترًا. ما التصرف المهني؟',
            options: ['أ) افتراض أنه يكذب.', 'ب) الاعتماد على لغة الجسد فقط.', 'ج) ملاحظة التناقض وطرح أسئلة استكشافية دون إصدار أحكام. ✅', 'د) إنهاء المقابلة.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال الخامس: خلال احدى الجلسات، لاحظت أن ثلاثة مشاركين عقدوا أذرعهم في الوقت نفسه. ما أفضل استنتاج؟',
            options: ['أ) جميعهم يرفضون الفكرة.', 'ب) جميعهم غاضبون.', 'ج) لا يمكن تفسير الإشارة بمعزل عن السياق. ✅', 'د) يريدون إنهاء الاجتماع.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال السادس: أثناء جلسة عصف ذهني، بدأ أحد المشاركين يهاجم الأشخاص بدلًا من الأفكار. ما التصرف الأكثر احترافية؟',
            options: ['أ) الرد عليه بنفس الأسلوب.', 'ب) تجاهل الهجوم.', 'ج) إعادة توجيه النقاش إلى الأفكار مع وضع حدود واضحة للحوار. ✅', 'د) إنهاء الاجتماع فورًا.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال السابع: أي العبارات التالية تعكس استماعًا نشطًا؟',
            options: ['أ) "أنا فاهم."', 'ب) "تقصد أن سبب المشكلة هو ضغط الوقت، هل فهمت بشكل صحيح؟" ✅', 'ج) "لا، أنت مخطئ."', 'د) "دعني أشرح لك."'],
            correct: 1
        },
        {
            type: 'mcq',
            question: 'السؤال الثامن: في أي موقف تكون إعادة الصياغة غير مناسبة؟',
            options: ['أ) عند التأكد من الفهم.', 'ب) عند وجود سوء فهم.', 'ج) عندما يكون المطلوب اتخاذ قرار عاجل دون الحاجة لتوضيح إضافي. ✅', 'د) أثناء جلسة إرشاد.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال التاسع: أي السلوكيات التالية تُضعف الثقة أكثر؟',
            options: ['أ) الحديث بسرعة.', 'ب) استخدام مصطلحات صعبة.', 'ج) تعارض لغة الجسد مع الرسالة المنطوقة. ✅', 'د) كثرة الأمثلة.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'السؤال العاشر: إذا كنت تيسر ورشة توعوية وظهر شخص مسيطر، فما الهدف الأول لتدخلك؟',
            options: ['أ) إيقافه.', 'ب) تقليل مشاركته.', 'ج) ضمان مشاركة جميع أعضاء الفريق دون إقصاء أحد. ✅', 'د) إنهاء الاجتماع.'],
            correct: 2
        },
        // الأسئلة 11-20 (صح / خطأ)
        {
            type: 'tf',
            question: 'السؤال 11: إذا كانت لغة الجسد تتعارض مع الكلمات، فمن الأفضل دائمًا تصديق لغة الجسد.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 12: الاستماع الفعّال يعني الصمت حتى ينتهي المتحدث من الكلام.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 13: يمكن أن تكون الرسالة واضحة للمرسل، لكنها تُفهم بطريقة مختلفة من المستقبل.',
            correct: true
        },
        {
            type: 'tf',
            question: 'السؤال 14: التغذية الراجعة تُستخدم فقط لتصحيح الأخطاء.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 15: الاختلاف في الخلفية الثقافية قد يؤدي إلى سوء فهم حتى عند استخدام الكلمات نفسها.',
            correct: true
        },
        {
            type: 'tf',
            question: 'السؤال 16: الشخص كثير الكلام يجب مقاطعته مباشرة حتى لا يضيع وقت الاجتماع.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 17: إعادة صياغة كلام المتحدث تعني تكرار كلماته حرفيًا.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 18: الهدف من التواصل الفعّال هو أن يقتنع الطرف الآخر دائمًا برأيك.',
            correct: false
        },
        {
            type: 'tf',
            question: 'السؤال 19: يمكن للمدرب أن يغيّر سلوك المشاركين من خلال أسلوب تواصله حتى لو لم يغيّر شخصياتهم.',
            correct: true
        },
        {
            type: 'tf',
            question: 'السؤال 20: إذا لم يطلب المستمع توضيحًا، فهذا يعني أنه فهم الرسالة بشكل صحيح.',
            correct: false
        }
    ];

    // بناء واجهة الأسئلة
    function renderQuiz() {
        const container = document.getElementById('quizForm');
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-block" id="q${idx}">`;
            html += `<div class="question-text">${q.question}</div>`;
            
            if (q.type === 'mcq') {
                html += `<div class="options">`;
                q.options.forEach((opt, optIdx) => {
                    html += `<label>
                        <input type="radio" name="q${idx}" value="${optIdx}">
                        ${opt}
                    </label>`;
                });
                html += `</div>`;
            } else { // true/false
                html += `<div class="true-false">
                    <label><input type="radio" name="q${idx}" value="true"> ✅ صح</label>
                    <label><input type="radio" name="q${idx}" value="false"> ❌ خطأ</label>
                </div>`;
            }
            html += `</div>`;
        });
        container.innerHTML = html;
    }

    // حساب النتيجة
    function submitQuiz() {
        let correct = 0;
        const total = questions.length;
        let allAnswered = true;

        questions.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            const block = document.getElementById(`q${idx}`);
            // إزالة التلوين القديم
            block.style.borderRightColor = '#2b7de9';
            
            if (!selected) {
                allAnswered = false;
                return;
            }

            let isCorrect = false;
            if (q.type === 'mcq') {
                isCorrect = (parseInt(selected.value) === q.correct);
            } else {
                isCorrect = (selected.value === String(q.correct));
            }

            if (isCorrect) {
                correct++;
                block.style.borderRightColor = '#28a745';
            } else {
                block.style.borderRightColor = '#dc3545';
            }
        });

        const resultBox = document.getElementById('resultBox');
        if (!allAnswered) {
            resultBox.innerHTML = `<div style="color:#dc3545; font-size:20px;">⚠️ من فضلك أجب على جميع الأسئلة قبل عرض النتيجة.</div>`;
            resultBox.classList.add('show');
            return;
        }

        const percentage = Math.round((correct / total) * 100);
        let feedbackText = '';
        if (percentage === 100) feedbackText = '🌟 ممتاز! أنت خبير في التواصل الفعّال!';
        else if (percentage >= 80) feedbackText = '💪 جيد جدًا! تحتاج فقط لمراجعة بسيطة.';
        else if (percentage >= 60) feedbackText = '📖 جيد، لكن أنصحك بمراجعة مهارات الاستماع والتواصل مرة أخرى.';
        else feedbackText = '📚 لا بأس! هذه فرصة للتعلم. راجع الأساسيات وحاول مرة أخرى.';

        resultBox.innerHTML = `
            <div class="score">${correct} / ${total} (${percentage}%)</div>
            <div class="feedback">${feedbackText}</div>
            <div style="margin-top:15px; font-size:14px; color:#555;">🔵 الإجابات الخضراء صحيحة، والحمراء تحتاج للمراجعة.</div>
        `;
        resultBox.classList.add('show');
        
        // تمرير سلس للنتيجة
        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // تشغيل التطبيق
    renderQuiz();
</script>
</body>
</html>
