<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مهارات التواصل الفعّال</title>
    <!-- خط رقعة (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background 0.5s ease;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .screen {
            display: none;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* شاشة الترحيب */
        #welcomeScreen {
            text-align: center;
            padding: 20px 0;
        }
        /* أزرار اللغة */
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .lang-btn {
            padding: 8px 28px;
            border: 2px solid #d1d9e6;
            background: white;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            color: #4a5a72;
        }
        .lang-btn:hover {
            border-color: #2b7de9;
            color: #2b7de9;
        }
        .lang-btn.active {
            background: #2b7de9;
            border-color: #2b7de9;
            color: white;
            box-shadow: 0 4px 15px rgba(43, 125, 233, 0.3);
        }
        #welcomeScreen h1 {
            font-size: 32px;
            color: #1a2b4a;
            margin-bottom: 8px;
        }
        #welcomeScreen p {
            color: #5a6e8a;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 30px;
            width: 100%;
        }
        .input-group input {
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            transition: 0.2s;
            background: #f9faff;
        }
        .input-group input:focus {
            border-color: #2b7de9;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(43, 125, 233, 0.15);
        }
        .btn-start {
            background: #2b7de9;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(43, 125, 233, 0.3);
        }
        .btn-start:hover {
            background: #1a5bbf;
            transform: scale(1.03);
        }

        /* شاشة الأسئلة */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eef2f7;
        }
        .quiz-header .q-number {
            font-size: 20px;
            font-weight: 700;
            color: #1a2b4a;
        }
        .quiz-header .user-info {
            font-size: 16px;
            color: #5a6e8a;
        }
        .timer-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .timer-bar-bg {
            flex: 1;
            height: 10px;
            background: #e9edf4;
            border-radius: 10px;
            overflow: hidden;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #2b7de9;
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .timer-text {
            font-weight: 700;
            font-size: 20px;
            color: #1a2b4a;
            min-width: 50px;
            text-align: left;
        }
        .timer-text.warning {
            color: #e74c3c;
        }
        .question-box {
            background: #f9faff;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border-right: 6px solid #2b7de9;
        }
        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            line-height: 1.6;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 10px 0 5px;
        }
        .options-grid label {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            background: white;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
            font-size: 18px;
        }
        .options-grid label:hover {
            background: #eef4ff;
            border-color: #2b7de9;
        }
        .options-grid input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #2b7de9;
            flex-shrink: 0;
        }
        .tf-group {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .tf-group label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
        }
        .tf-group label:hover {
            background: #eef4ff;
            border-color: #2b7de9;
        }

        /* شاشة النتيجة */
        #resultScreen {
            text-align: center;
            padding: 20px 0;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }
        .result-name {
            font-size: 26px;
            font-weight: 700;
            color: #1a2b4a;
        }
        .result-score {
            font-size: 70px;
            font-weight: 900;
            margin: 15px 0;
            background: linear-gradient(135deg, #2b7de9, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-feedback {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .result-details {
            font-size: 18px;
            color: #4a5a72;
            background: #f4f7fc;
            padding: 15px;
            border-radius: 12px;
        }
        .btn-restart {
            margin-top: 15px;
            background: #1a2b4a;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-restart:hover {
            background: #0b1a33;
            transform: scale(1.03);
        }
        /* زر مشاركة واتساب */
        .btn-share {
            margin-top: 15px;
            background: #25D366;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-share:hover {
            background: #1ebe5c;
            transform: scale(1.03);
        }
        .share-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* حالات النتيجة */
        .celebrate {
            background: linear-gradient(135deg, #fef9e7, #fdebd0);
        }
        .celebrate .result-score {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .celebrate .result-feedback {
            color: #d35400;
        }

        .encourage {
            background: linear-gradient(135deg, #eaf2f8, #d6eaf8);
        }
        .encourage .result-score {
            background: linear-gradient(135deg, #3498db, #2980b9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .encourage .result-feedback {
            color: #2471a3;
        }

        /* كونفيتي */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            top: -20px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            .question-text { font-size: 19px; }
            .tf-group label { padding: 12px; }
            .result-score { font-size: 50px; }
            .lang-btn { padding: 6px 18px; font-size: 15px; }
            .btn-share, .btn-restart { padding: 12px 20px; font-size: 17px; width: 100%; }
            .share-container { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- ===== شاشة الترحيب ===== -->
    <div id="welcomeScreen" class="screen active">
        <!-- أزرار تبديل اللغة -->
        <div class="lang-switch">
            <button class="lang-btn active" id="langAr" onclick="setLanguage('ar')">🇸🇦 عربي</button>
            <button class="lang-btn" id="langEn" onclick="setLanguage('en')">🇬🇧 English</button>
        </div>
        <h1 id="welcomeTitle">🧠 اختبار التواصل الفعّال</h1>
        <p id="welcomeSub">اختبر مهاراتك في التواصل والاستماع النشط<br>أجب على 20 سؤالاً، كل سؤال لديك 30 ثانية فقط!</p>
        <div class="input-group">
            <input type="text" id="userName" placeholder="✏️ الاسم الكامل" />
            <input type="text" id="userPlace" placeholder="🏷️ اسم الفريق" />
        </div>
        <button class="btn-start" id="startBtn" onclick="startQuiz()">🚀 ابدأ الاختبار</button>
    </div>

    <!-- ===== شاشة الأسئلة ===== -->
    <div id="quizScreen" class="screen">
        <div class="quiz-header">
            <span class="q-number" id="qNumber">1 / 20</span>
            <span class="user-info" id="displayUserInfo">👤 ...</span>
        </div>
        <div class="timer-section">
            <div class="timer-bar-bg">
                <div class="timer-bar-fill" id="timerFill"></div>
            </div>
            <span class="timer-text" id="timerText">30</span>
        </div>
        <div class="question-box" id="questionBox">
            <div class="question-text" id="qText">جاري تحميل السؤال...</div>
            <div id="optionsContainer"></div>
        </div>
    </div>

    <!-- ===== شاشة النتيجة ===== -->
    <div id="resultScreen" class="screen">
        <div class="result-icon" id="resultIcon">🎉</div>
        <div class="result-name" id="resultName">أهلاً بك!</div>
        <div class="result-score" id="resultScore">0%</div>
        <div class="result-feedback" id="resultFeedback">نتيجة رائعة!</div>
        <div class="result-details" id="resultDetails"></div>
        <div class="share-container">
            <button class="btn-share" id="shareBtn" onclick="shareOnWhatsApp()">💬 مشاركة على واتساب</button>
            <button class="btn-restart" id="restartBtn" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  بيانات الأسئلة (ثنائية اللغة)
    // ============================================================
    const questions = [
        // 1-10 اختيار من متعدد
        {
            ar: { q: 'خلال اجتماع، قال أحد أعضاء الفريق: "هذه الفكرة لن تنجح إطلاقًا." لاحظت أن بقية الفريق صمتوا، ولم يعد أحد يشارك. ما الخطوة الأولى الأكثر فاعلية؟', opts: ['أ) الدفاع عن الفكرة.', 'ب) تجاهل التعليق.', 'ج) سؤال المعترض عن الأسباب وطلب بدائل مع تشجيع بقية الفريق على المشاركة.', 'د) الانتقال مباشرة إلى الموضوع التالي.'] },
            en: { q: 'During a meeting, a team member said: "This idea will never work." You notice the rest of the team falls silent. What is the most effective first step?', opts: ['a) Defend the idea.', 'b) Ignore the comment.', 'c) Ask the objector for reasons and alternatives while encouraging others to participate.', 'd) Move to the next topic.'] },
            correct: 2
        },
        {
            ar: { q: 'أثناء التدريب، أحد المشاركين يجيب عن جميع الأسئلة قبل الآخرين. بعد مرور 20 دقيقة بدأ المشاركون الآخرون في الانسحاب من النقاش. ما الخطأ الذي ارتكبه المدرب؟', opts: ['أ) أعطى معلومات كثيرة.', 'ب) لم يدير ديناميكية المجموعة بشكل متوازن.', 'ج) استخدم وسائل عرض كثيرة.', 'د) طرح أسئلة مفتوحة.'] },
            en: { q: 'During training, one participant answers all questions before others. After 20 minutes, others start withdrawing from the discussion. What mistake did the trainer make?', opts: ['a) Gave too much information.', 'b) Didn\'t balance group dynamics.', 'c) Used too many presentation tools.', 'd) Asked open-ended questions.'] },
            correct: 1
        },
        {
            ar: { q: 'قال المدير: "أحتاج التقرير بسرعة." الموظف أرسله الساعة الرابعة عصرًا. المدير كان يقصده خلال ساعة. أي عنصر فشل؟', opts: ['أ) الرسالة.', 'ب) التغذية الراجعة.', 'ج) تحديد التوقعات.', 'د) المرسل.'] },
            en: { q: 'Manager said: "I need the report quickly." Employee sent it at 4 PM. Manager meant within an hour. Which element failed?', opts: ['a) The message.', 'b) Feedback.', 'c) Setting expectations.', 'd) The sender.'] },
            correct: 2
        },
        {
            ar: { q: 'أحد المستفيدين يقول: "أنا بخير." لكنه: يتجنب التواصل البصري، يتحدث بصوت منخفض، يبدو متوترًا. ما التصرف المهني؟', opts: ['أ) افتراض أنه يكذب.', 'ب) الاعتماد على لغة الجسد فقط.', 'ج) ملاحظة التناقض وطرح أسئلة استكشافية دون إصدار أحكام.', 'د) إنهاء المقابلة.'] },
            en: { q: 'A beneficiary says: "I\'m fine." But they avoid eye contact, speak softly, and seem tense. What is the professional action?', opts: ['a) Assume they are lying.', 'b) Rely only on body language.', 'c) Note the contradiction and ask exploratory questions without judgment.', 'd) End the interview.'] },
            correct: 2
        },
        {
            ar: { q: 'خلال احدى الجلسات، لاحظت أن ثلاثة مشاركين عقدوا أذرعهم في الوقت نفسه. ما أفضل استنتاج؟', opts: ['أ) جميعهم يرفضون الفكرة.', 'ب) جميعهم غاضبون.', 'ج) لا يمكن تفسير الإشارة بمعزل عن السياق.', 'د) يريدون إنهاء الاجتماع.'] },
            en: { q: 'During a session, you notice three participants crossed their arms at the same time. What is the best conclusion?', opts: ['a) They all reject the idea.', 'b) They are all angry.', 'c) The gesture cannot be interpreted without context.', 'd) They want to end the meeting.'] },
            correct: 2
        },
        {
            ar: { q: 'أثناء جلسة عصف ذهني، بدأ أحد المشاركين يهاجم الأشخاص بدلًا من الأفكار. ما التصرف الأكثر احترافية؟', opts: ['أ) الرد عليه بنفس الأسلوب.', 'ب) تجاهل الهجوم.', 'ج) إعادة توجيه النقاش إلى الأفكار مع وضع حدود واضحة للحوار.', 'د) إنهاء الاجتماع فورًا.'] },
            en: { q: 'During a brainstorming session, a participant starts attacking people instead of ideas. What is the most professional response?', opts: ['a) Respond in the same manner.', 'b) Ignore the attack.', 'c) Redirect the discussion to ideas while setting clear boundaries.', 'd) End the meeting immediately.'] },
            correct: 2
        },
        {
            ar: { q: 'أي العبارات التالية تعكس استماعًا نشطًا؟', opts: ['أ) "أنا فاهم."', 'ب) "تقصد أن سبب المشكلة هو ضغط الوقت، هل فهمت بشكل صحيح؟"', 'ج) "لا، أنت مخطئ."', 'د) "دعني أشرح لك."'] },
            en: { q: 'Which statement reflects active listening?', opts: ['a) "I understand."', 'b) "You mean the problem is time pressure, did I understand correctly?"', 'c) "No, you are wrong."', 'd) "Let me explain to you."'] },
            correct: 1
        },
        {
            ar: { q: 'في أي موقف تكون إعادة الصياغة غير مناسبة؟', opts: ['أ) عند التأكد من الفهم.', 'ب) عند وجود سوء فهم.', 'ج) عندما يكون المطلوب اتخاذ قرار عاجل دون الحاجة لتوضيح إضافي.', 'د) أثناء جلسة إرشاد.'] },
            en: { q: 'In which situation is paraphrasing inappropriate?', opts: ['a) When confirming understanding.', 'b) When there is misunderstanding.', 'c) When an urgent decision is needed without further clarification.', 'd) During a counseling session.'] },
            correct: 2
        },
        {
            ar: { q: 'أي السلوكيات التالية تُضعف الثقة أكثر؟', opts: ['أ) الحديث بسرعة.', 'ب) استخدام مصطلحات صعبة.', 'ج) تعارض لغة الجسد مع الرسالة المنطوقة.', 'د) كثرة الأمثلة.'] },
            en: { q: 'Which behavior undermines trust the most?', opts: ['a) Speaking fast.', 'b) Using difficult terminology.', 'c) Body language contradicting the spoken message.', 'd) Using too many examples.'] },
            correct: 2
        },
        {
            ar: { q: 'إذا كنت تيسر ورشة توعوية وظهر شخص مسيطر، فما الهدف الأول لتدخلك؟', opts: ['أ) إيقافه.', 'ب) تقليل مشاركته.', 'ج) ضمان مشاركة جميع أعضاء الفريق دون إقصاء أحد.', 'د) إنهاء الاجتماع.'] },
            en: { q: 'If you are facilitating a workshop and a dominant person appears, what is the primary goal of your intervention?', opts: ['a) Stop them.', 'b) Reduce their participation.', 'c) Ensure all team members participate without exclusion.', 'd) End the meeting.'] },
            correct: 2
        },
        // 11-20 صح / خطأ
        {
            ar: { q: 'إذا كانت لغة الجسد تتعارض مع الكلمات، فمن الأفضل دائمًا تصديق لغة الجسد.' },
            en: { q: 'If body language contradicts words, it is always better to trust body language.' },
            correct: false
        },
        {
            ar: { q: 'الاستماع الفعّال يعني الصمت حتى ينتهي المتحدث من الكلام.' },
            en: { q: 'Active listening means silence until the speaker finishes speaking.' },
            correct: false
        },
        {
            ar: { q: 'يمكن أن تكون الرسالة واضحة للمرسل، لكنها تُفهم بطريقة مختلفة من المستقبل.' },
            en: { q: 'A message clear to the sender can be understood differently by the receiver.' },
            correct: true
        },
        {
            ar: { q: 'التغذية الراجعة تُستخدم فقط لتصحيح الأخطاء.' },
            en: { q: 'Feedback is only used to correct mistakes.' },
            correct: false
        },
        {
            ar: { q: 'الاختلاف في الخلفية الثقافية قد يؤدي إلى سوء فهم حتى عند استخدام الكلمات نفسها.' },
            en: { q: 'Differences in cultural background can lead to misunderstandings even when using the same words.' },
            correct: true
        },
        {
            ar: { q: 'الشخص كثير الكلام يجب مقاطعته مباشرة حتى لا يضيع وقت الاجتماع.' },
            en: { q: 'A talkative person should be interrupted directly to save meeting time.' },
            correct: false
        },
        {
            ar: { q: 'إعادة صياغة كلام المتحدث تعني تكرار كلماته حرفيًا.' },
            en: { q: 'Paraphrasing the speaker\'s words means repeating them verbatim.' },
            correct: false
        },
        {
            ar: { q: 'الهدف من التواصل الفعّال هو أن يقتنع الطرف الآخر دائمًا برأيك.' },
            en: { q: 'The goal of effective communication is to always convince the other party of your opinion.' },
            correct: false
        },
        {
            ar: { q: 'يمكن للمدرب أن يغيّر سلوك المشاركين من خلال أسلوب تواصله حتى لو لم يغيّر شخصياتهم.' },
            en: { q: 'A trainer can change participants\' behavior through their communication style even without changing their personalities.' },
            correct: true
        },
        {
            ar: { q: 'إذا لم يطلب المستمع توضيحًا، فهذا يعني أنه فهم الرسالة بشكل صحيح.' },
            en: { q: 'If the listener doesn\'t ask for clarification, it means they understood the message correctly.' },
            correct: false
        }
    ];

    // ============================================================
    //  الترجمة (نصوص الواجهة)
    // ============================================================
    const translations = {
        ar: {
            title: '🧠 اختبار التواصل الفعّال',
            subtitle: 'اختبر مهاراتك في التواصل والاستماع النشط<br>أجب على 20 سؤالاً، كل سؤال لديك 30 ثانية فقط!',
            namePlaceholder: '✏️ الاسم الكامل',
            teamPlaceholder: '🏷️ اسم الفريق',
            startBtn: '🚀 ابدأ الاختبار',
            userLabel: '👤',
            teamLabel: '🏷️',
            resultFrom: 'من فريق',
            resultCorrect: 'أجبت بشكل صحيح على',
            resultOutOf: 'من أصل',
            resultHigh: 'ممتاز! مستوى تواصلك رائع، استمر في التميز!',
            resultLow: 'لا بأس! هذه فرصة رائعة للتعلم والتطوير، واصل القراءة والممارسة!',
            restartBtn: '🔄 إعادة الاختبار',
            shareBtn: '💬 مشاركة على واتساب',
            trueLabel: '✅ صح',
            falseLabel: '❌ خطأ',
            questionPrefix: 'سؤال',
            shareTextHigh: '🎉 حققت نسبة {percentage}% في اختبار مهارات التواصل! ({correct}/{total}) أنا {name} من فريق {team}. اختبر نفسك الآن!',
            shareTextLow: '💪 حصلت على {percentage}% في اختبار مهارات التواصل ({correct}/{total}). أنا {name} من فريق {team}. جرب الاختبار وطور مهاراتك!'
        },
        en: {
            title: '🧠 Effective Communication Test',
            subtitle: 'Test your communication and active listening skills.<br>Answer 20 questions, you have only 30 seconds per question!',
            namePlaceholder: '✏️ Full Name',
            teamPlaceholder: '🏷️ Team Name',
            startBtn: '🚀 Start Test',
            userLabel: '👤',
            teamLabel: '🏷️',
            resultFrom: 'from team',
            resultCorrect: 'You answered correctly on',
            resultOutOf: 'out of',
            resultHigh: 'Excellent! Your communication level is great, keep it up!',
            resultLow: 'It\'s okay! This is a great opportunity to learn and develop, keep reading and practicing!',
            restartBtn: '🔄 Retake Test',
            shareBtn: '💬 Share on WhatsApp',
            trueLabel: '✅ True',
            falseLabel: '❌ False',
            questionPrefix: 'Question',
            shareTextHigh: '🎉 I scored {percentage}% in the Effective Communication Test! ({correct}/{total}) I\'m {name} from team {team}. Take the test now!',
            shareTextLow: '💪 I got {percentage}% in the Effective Communication Test ({correct}/{total}). I\'m {name} from team {team}. Try the test and improve your skills!'
        }
    };

    // ============================================================
    //  متغيرات التحكم
    // ============================================================
    let currentLang = 'ar';
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    const TOTAL_TIME = 30;
    let userName = '';
    let userPlace = '';
    let isAnswered = false;

    // ============================================================
    //  دوال اللغة
    // ============================================================
    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('langAr').classList.toggle('active', lang === 'ar');
        document.getElementById('langEn').classList.toggle('active', lang === 'en');
        
        const container = document.querySelector('.container');
        if (lang === 'ar') {
            container.style.direction = 'rtl';
            document.documentElement.dir = 'rtl';
        } else {
            container.style.direction = 'ltr';
            document.documentElement.dir = 'ltr';
        }
        
        updateWelcomeTexts();
    }

    function updateWelcomeTexts() {
        const t = translations[currentLang];
        document.getElementById('welcomeTitle').textContent = t.title;
        document.getElementById('welcomeSub').innerHTML = t.subtitle;
        document.getElementById('userName').placeholder = t.namePlaceholder;
        document.getElementById('userPlace').placeholder = t.teamPlaceholder;
        document.getElementById('startBtn').textContent = t.startBtn;
        document.getElementById('restartBtn').textContent = t.restartBtn;
        document.getElementById('shareBtn').textContent = t.shareBtn;
        
        if (userName) {
            updateUserInfoDisplay();
        }
    }

    function updateUserInfoDisplay() {
        const t = translations[currentLang];
        const name = userName || (currentLang === 'ar' ? 'ضيف' : 'Guest');
        const place = userPlace || (currentLang === 'ar' ? 'غير محدد' : 'Not specified');
        document.getElementById('displayUserInfo').textContent = `${t.userLabel} ${name} | ${t.teamLabel} ${place}`;
    }

    // ============================================================
    //  دوال التحكم الرئيسية
    // ============================================================
    function startQuiz() {
        userName = document.getElementById('userName').value.trim() || (currentLang === 'ar' ? 'ضيف' : 'Guest');
        userPlace = document.getElementById('userPlace').value.trim() || (currentLang === 'ar' ? 'غير محدد' : 'Not specified');
        
        updateUserInfoDisplay();
        
        document.getElementById('welcomeScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        
        currentIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            showResults();
            return;
        }

        isAnswered = false;
        const q = questions[currentIndex];
        const langData = q[currentLang];
        const total = questions.length;
        
        const t = translations[currentLang];
        document.getElementById('qNumber').textContent = `${t.questionPrefix} ${currentIndex + 1} / ${total}`;
        document.getElementById('qText').textContent = langData.q;
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        if (q.correct === true || q.correct === false) {
            const tfDiv = document.createElement('div');
            tfDiv.className = 'tf-group';
            
            const trueLabel = document.createElement('label');
            const trueRadio = document.createElement('input');
            trueRadio.type = 'radio';
            trueRadio.name = 'question';
            trueRadio.value = 'true';
            trueRadio.onclick = () => selectAnswer(true);
            trueLabel.appendChild(trueRadio);
            trueLabel.appendChild(document.createTextNode(t.trueLabel));
            
            const falseLabel = document.createElement('label');
            const falseRadio = document.createElement('input');
            falseRadio.type = 'radio';
            falseRadio.name = 'question';
            falseRadio.value = 'false';
            falseRadio.onclick = () => selectAnswer(false);
            falseLabel.appendChild(falseRadio);
            falseLabel.appendChild(document.createTextNode(t.falseLabel));
            
            tfDiv.appendChild(trueLabel);
            tfDiv.appendChild(falseLabel);
            container.appendChild(tfDiv);
        } else {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            langData.opts.forEach((opt, idx) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'question';
                radio.value = idx;
                radio.onclick = () => selectAnswer(idx);
                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                grid.appendChild(label);
            });
            container.appendChild(grid);
        }
        
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TOTAL_TIME;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!isAnswered) {
                    isAnswered = true;
                    currentIndex++;
                    loadQuestion();
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const fill = document.getElementById('timerFill');
        const text = document.getElementById('timerText');
        const percentage = (timeLeft / TOTAL_TIME) * 100;
        fill.style.width = `${Math.max(0, percentage)}%`;
        text.textContent = timeLeft;
        
        if (timeLeft <= 5) {
            text.classList.add('warning');
            fill.style.background = '#e74c3c';
        } else {
            text.classList.remove('warning');
            fill.style.background = '#2b7de9';
        }
    }

    function selectAnswer(selectedValue) {
        if (isAnswered) return;
        isAnswered = true;
        clearInterval(timerInterval);
        
        const q = questions[currentIndex];
        let isCorrect = false;
        
        if (typeof q.correct === 'boolean') {
            isCorrect = (selectedValue === q.correct);
        } else {
            isCorrect = (selectedValue === q.correct);
        }
        
        if (isCorrect) score++;
        
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 300);
    }

    // ============================================================
    //  النتيجة
    // ============================================================
    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        
        const total = questions.length;
        const percentage = Math.round((score / total) * 100);
        const t = translations[currentLang];
        const name = userName || (currentLang === 'ar' ? 'ضيف' : 'Guest');
        const place = userPlace || (currentLang === 'ar' ? 'غير محدد' : 'Not specified');
        
        document.getElementById('resultName').textContent = `👋 ${name} ${t.resultFrom} ${place}`;
        document.getElementById('resultScore').textContent = `${percentage}%`;
        document.getElementById('resultDetails').textContent = `${t.resultCorrect} ${score} ${t.resultOutOf} ${total} ${currentLang === 'ar' ? 'سؤال' : 'questions'}.`;
        
        const icon = document.getElementById('resultIcon');
        const feedback = document.getElementById('resultFeedback');
        const container = document.getElementById('appContainer');
        
        container.classList.remove('celebrate', 'encourage');
        
        if (percentage >= 50) {
            container.classList.add('celebrate');
            icon.textContent = '🎉🏆🎊';
            feedback.textContent = t.resultHigh;
            launchConfetti();
        } else {
            container.classList.add('encourage');
            icon.textContent = '💪📚😊';
            feedback.textContent = t.resultLow;
        }
    }

    // ============================================================
    //  مشاركة على واتساب 🆕
    // ============================================================
    function shareOnWhatsApp() {
        const total = questions.length;
        const percentage = Math.round((score / total) * 100);
        const t = translations[currentLang];
        const name = userName || (currentLang === 'ar' ? 'ضيف' : 'Guest');
        const place = userPlace || (currentLang === 'ar' ? 'غير محدد' : 'Not specified');
        
        // اختيار النص المناسب حسب النتيجة
        let shareText;
        if (percentage >= 50) {
            shareText = t.shareTextHigh
                .replace('{percentage}', percentage)
                .replace('{correct}', score)
                .replace('{total}', total)
                .replace('{name}', name)
                .replace('{team}', place);
        } else {
            shareText = t.shareTextLow
                .replace('{percentage}', percentage)
                .replace('{correct}', score)
                .replace('{total}', total)
                .replace('{name}', name)
                .replace('{team}', place);
        }
        
        // إضافة رابط الاختبار (رابط الموقع الحالي)
        const url = window.location.href;
        const fullMessage = `${shareText}\n\n🔗 رابط الاختبار: ${url}`;
        
        // ترميز النص لاستخدامه في رابط واتساب
        const encodedMessage = encodeURIComponent(fullMessage);
        const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;
        
        // فتح رابط واتساب في نافذة جديدة
        window.open(whatsappUrl, '_blank');
    }

    // ============================================================
    //  كونفيتي
    // ============================================================
    function launchConfetti() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        document.body.appendChild(container);
        
        const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#1abc9c'];
        for (let i = 0; i < 150; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 10 + 6) + 'px';
            piece.style.height = (Math.random() * 10 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
            piece.style.animationDelay = (Math.random() * 2) + 's';
            container.appendChild(piece);
        }
        
        setTimeout(() => {
            if (container.parentNode) container.remove();
        }, 5000);
    }

    // ============================================================
    //  إعادة الاختبار
    // ============================================================
    function restartQuiz() {
        clearInterval(timerInterval);
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('welcomeScreen').classList.add('active');
        document.getElementById('appContainer').classList.remove('celebrate', 'encourage');
        document.querySelectorAll('.confetti-container').forEach(el => el.remove());
        
        document.getElementById('userName').value = userName;
        document.getElementById('userPlace').value = userPlace;
        
        currentIndex = 0;
        score = 0;
        isAnswered = false;
        
        updateWelcomeTexts();
    }

    // ============================================================
    //  بدء التشغيل
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('welcomeScreen').classList.add('active');
        setLanguage('ar');
    });
</script>
</body>
