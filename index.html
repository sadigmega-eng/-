<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مهارات التواصل الفعّال</title>
    <!-- خط رقعة (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background 0.5s ease;
        }
        .container {
            max-width: 780px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .screen {
            display: none;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* شاشة الترحيب */
        #welcomeScreen {
            text-align: center;
            padding: 20px 0;
        }
        #welcomeScreen h1 {
            font-size: 32px;
            color: #1a2b4a;
            margin-bottom: 8px;
        }
        #welcomeScreen p {
            color: #5a6e8a;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 30px;
            width: 100%;
        }
        .input-group input {
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            transition: 0.2s;
            background: #f9faff;
        }
        .input-group input:focus {
            border-color: #2b7de9;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(43, 125, 233, 0.15);
        }
        .btn-start {
            background: #2b7de9;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(43, 125, 233, 0.3);
        }
        .btn-start:hover {
            background: #1a5bbf;
            transform: scale(1.03);
        }

        /* شاشة الأسئلة */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eef2f7;
        }
        .quiz-header .q-number {
            font-size: 20px;
            font-weight: 700;
            color: #1a2b4a;
        }
        .quiz-header .user-info {
            font-size: 16px;
            color: #5a6e8a;
        }
        .timer-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .timer-bar-bg {
            flex: 1;
            height: 10px;
            background: #e9edf4;
            border-radius: 10px;
            overflow: hidden;
        }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #2b7de9;
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .timer-text {
            font-weight: 700;
            font-size: 20px;
            color: #1a2b4a;
            min-width: 50px;
            text-align: left;
        }
        .timer-text.warning {
            color: #e74c3c;
        }
        .question-box {
            background: #f9faff;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border-right: 6px solid #2b7de9;
        }
        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            line-height: 1.6;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 10px 0 5px;
        }
        .options-grid label {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            background: white;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
            font-size: 18px;
        }
        .options-grid label:hover {
            background: #eef4ff;
            border-color: #2b7de9;
        }
        .options-grid input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #2b7de9;
            flex-shrink: 0;
        }
        .tf-group {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .tf-group label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 30px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
        }
        .tf-group label:hover {
            background: #eef4ff;
            border-color: #2b7de9;
        }

        /* شاشة النتيجة */
        #resultScreen {
            text-align: center;
            padding: 20px 0;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }
        .result-name {
            font-size: 26px;
            font-weight: 700;
            color: #1a2b4a;
        }
        .result-score {
            font-size: 70px;
            font-weight: 900;
            margin: 15px 0;
            background: linear-gradient(135deg, #2b7de9, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-feedback {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .result-details {
            font-size: 18px;
            color: #4a5a72;
            background: #f4f7fc;
            padding: 15px;
            border-radius: 12px;
        }
        .btn-restart {
            margin-top: 25px;
            background: #1a2b4a;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-restart:hover {
            background: #0b1a33;
            transform: scale(1.03);
        }

        /* حالات النتيجة */
        .celebrate {
            background: linear-gradient(135deg, #fef9e7, #fdebd0);
        }
        .celebrate .result-score {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .celebrate .result-feedback {
            color: #d35400;
        }

        .encourage {
            background: linear-gradient(135deg, #eaf2f8, #d6eaf8);
        }
        .encourage .result-score {
            background: linear-gradient(135deg, #3498db, #2980b9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .encourage .result-feedback {
            color: #2471a3;
        }

        /* كونفيتي */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            top: -20px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            .question-text { font-size: 19px; }
            .tf-group label { padding: 12px; }
            .result-score { font-size: 50px; }
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- ===== شاشة الترحيب ===== -->
    <div id="welcomeScreen" class="screen active">
        <h1>🧠 اختبار التواصل الفعّال</h1>
        <p>اختبر مهاراتك في التواصل والاستماع النشط<br>أجب على 20 سؤالاً، كل سؤال لديك <strong>30 ثانية</strong> فقط!</p>
        <div class="input-group">
            <input type="text" id="userName" placeholder="✏️ الاسم الكامل" />
            <input type="text" id="userPlace" placeholder="🏷️ اسم الفريق" />
        </div>
        <button class="btn-start" onclick="startQuiz()">🚀 ابدأ الاختبار</button>
    </div>

    <!-- ===== شاشة الأسئلة ===== -->
    <div id="quizScreen" class="screen">
        <div class="quiz-header">
            <span class="q-number" id="qNumber">1 / 20</span>
            <span class="user-info" id="displayUserInfo">👤 ...</span>
        </div>
        <div class="timer-section">
            <div class="timer-bar-bg">
                <div class="timer-bar-fill" id="timerFill"></div>
            </div>
            <span class="timer-text" id="timerText">30</span>
        </div>
        <div class="question-box" id="questionBox">
            <div class="question-text" id="qText">جاري تحميل السؤال...</div>
            <div id="optionsContainer"></div>
        </div>
    </div>

    <!-- ===== شاشة النتيجة ===== -->
    <div id="resultScreen" class="screen">
        <div class="result-icon" id="resultIcon">🎉</div>
        <div class="result-name" id="resultName">أهلاً بك!</div>
        <div class="result-score" id="resultScore">0%</div>
        <div class="result-feedback" id="resultFeedback">نتيجة رائعة!</div>
        <div class="result-details" id="resultDetails"></div>
        <button class="btn-restart" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
    </div>
</div>

<script>
    // ============================================================
    //  بيانات الأسئلة (20 سؤالاً)
    // ============================================================
    const questions = [
        // 1-10 اختيار من متعدد
        {
            type: 'mcq',
            question: 'خلال اجتماع، قال أحد أعضاء الفريق: "هذه الفكرة لن تنجح إطلاقًا." لاحظت أن بقية الفريق صمتوا، ولم يعد أحد يشارك. ما الخطوة الأولى الأكثر فاعلية؟',
            options: ['أ) الدفاع عن الفكرة.', 'ب) تجاهل التعليق.', 'ج) سؤال المعترض عن الأسباب وطلب بدائل مع تشجيع بقية الفريق على المشاركة.', 'د) الانتقال مباشرة إلى الموضوع التالي.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'أثناء التدريب، أحد المشاركين يجيب عن جميع الأسئلة قبل الآخرين. بعد مرور 20 دقيقة بدأ المشاركون الآخرون في الانسحاب من النقاش. ما الخطأ الذي ارتكبه المدرب؟',
            options: ['أ) أعطى معلومات كثيرة.', 'ب) لم يدير ديناميكية المجموعة بشكل متوازن.', 'ج) استخدم وسائل عرض كثيرة.', 'د) طرح أسئلة مفتوحة.'],
            correct: 1
        },
        {
            type: 'mcq',
            question: 'قال المدير: "أحتاج التقرير بسرعة." الموظف أرسله الساعة الرابعة عصرًا. المدير كان يقصده خلال ساعة. أي عنصر فشل؟',
            options: ['أ) الرسالة.', 'ب) التغذية الراجعة.', 'ج) تحديد التوقعات.', 'د) المرسل.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'أحد المستفيدين يقول: "أنا بخير." لكنه: يتجنب التواصل البصري، يتحدث بصوت منخفض، يبدو متوترًا. ما التصرف المهني؟',
            options: ['أ) افتراض أنه يكذب.', 'ب) الاعتماد على لغة الجسد فقط.', 'ج) ملاحظة التناقض وطرح أسئلة استكشافية دون إصدار أحكام.', 'د) إنهاء المقابلة.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'خلال احدى الجلسات، لاحظت أن ثلاثة مشاركين عقدوا أذرعهم في الوقت نفسه. ما أفضل استنتاج؟',
            options: ['أ) جميعهم يرفضون الفكرة.', 'ب) جميعهم غاضبون.', 'ج) لا يمكن تفسير الإشارة بمعزل عن السياق.', 'د) يريدون إنهاء الاجتماع.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'أثناء جلسة عصف ذهني، بدأ أحد المشاركين يهاجم الأشخاص بدلًا من الأفكار. ما التصرف الأكثر احترافية؟',
            options: ['أ) الرد عليه بنفس الأسلوب.', 'ب) تجاهل الهجوم.', 'ج) إعادة توجيه النقاش إلى الأفكار مع وضع حدود واضحة للحوار.', 'د) إنهاء الاجتماع فورًا.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'أي العبارات التالية تعكس استماعًا نشطًا؟',
            options: ['أ) "أنا فاهم."', 'ب) "تقصد أن سبب المشكلة هو ضغط الوقت، هل فهمت بشكل صحيح؟"', 'ج) "لا، أنت مخطئ."', 'د) "دعني أشرح لك."'],
            correct: 1
        },
        {
            type: 'mcq',
            question: 'في أي موقف تكون إعادة الصياغة غير مناسبة؟',
            options: ['أ) عند التأكد من الفهم.', 'ب) عند وجود سوء فهم.', 'ج) عندما يكون المطلوب اتخاذ قرار عاجل دون الحاجة لتوضيح إضافي.', 'د) أثناء جلسة إرشاد.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'أي السلوكيات التالية تُضعف الثقة أكثر؟',
            options: ['أ) الحديث بسرعة.', 'ب) استخدام مصطلحات صعبة.', 'ج) تعارض لغة الجسد مع الرسالة المنطوقة.', 'د) كثرة الأمثلة.'],
            correct: 2
        },
        {
            type: 'mcq',
            question: 'إذا كنت تيسر ورشة توعوية وظهر شخص مسيطر، فما الهدف الأول لتدخلك؟',
            options: ['أ) إيقافه.', 'ب) تقليل مشاركته.', 'ج) ضمان مشاركة جميع أعضاء الفريق دون إقصاء أحد.', 'د) إنهاء الاجتماع.'],
            correct: 2
        },
        // 11-20 صح / خطأ
        {
            type: 'tf',
            question: 'إذا كانت لغة الجسد تتعارض مع الكلمات، فمن الأفضل دائمًا تصديق لغة الجسد.',
            correct: false
        },
        {
            type: 'tf',
            question: 'الاستماع الفعّال يعني الصمت حتى ينتهي المتحدث من الكلام.',
            correct: false
        },
        {
            type: 'tf',
            question: 'يمكن أن تكون الرسالة واضحة للمرسل، لكنها تُفهم بطريقة مختلفة من المستقبل.',
            correct: true
        },
        {
            type: 'tf',
            question: 'التغذية الراجعة تُستخدم فقط لتصحيح الأخطاء.',
            correct: false
        },
        {
            type: 'tf',
            question: 'الاختلاف في الخلفية الثقافية قد يؤدي إلى سوء فهم حتى عند استخدام الكلمات نفسها.',
            correct: true
        },
        {
            type: 'tf',
            question: 'الشخص كثير الكلام يجب مقاطعته مباشرة حتى لا يضيع وقت الاجتماع.',
            correct: false
        },
        {
            type: 'tf',
            question: 'إعادة صياغة كلام المتحدث تعني تكرار كلماته حرفيًا.',
            correct: false
        },
        {
            type: 'tf',
            question: 'الهدف من التواصل الفعّال هو أن يقتنع الطرف الآخر دائمًا برأيك.',
            correct: false
        },
        {
            type: 'tf',
            question: 'يمكن للمدرب أن يغيّر سلوك المشاركين من خلال أسلوب تواصله حتى لو لم يغيّر شخصياتهم.',
            correct: true
        },
        {
            type: 'tf',
            question: 'إذا لم يطلب المستمع توضيحًا، فهذا يعني أنه فهم الرسالة بشكل صحيح.',
            correct: false
        }
    ];

    // ============================================================
    //  متغيرات التحكم
    // ============================================================
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;
    const TOTAL_TIME = 30;  // <--- تم التعديل من 20 إلى 30
    let userName = '';
    let userPlace = '';
    let isAnswered = false;

    // ============================================================
    //  دوال التحكم
    // ============================================================
    function startQuiz() {
        userName = document.getElementById('userName').value.trim() || 'ضيف';
        userPlace = document.getElementById('userPlace').value.trim() || 'غير محدد';
        
        document.getElementById('displayUserInfo').textContent = `👤 ${userName} | 🏷️ ${userPlace}`;
        
        document.getElementById('welcomeScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        
        currentIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            showResults();
            return;
        }

        isAnswered = false;
        const q = questions[currentIndex];
        
        document.getElementById('qNumber').textContent = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('qText').textContent = q.question;
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        if (q.type === 'mcq') {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            q.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'question';
                radio.value = idx;
                radio.onclick = () => selectAnswer(idx);
                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                grid.appendChild(label);
            });
            container.appendChild(grid);
        } else {
            const tfDiv = document.createElement('div');
            tfDiv.className = 'tf-group';
            
            const trueLabel = document.createElement('label');
            const trueRadio = document.createElement('input');
            trueRadio.type = 'radio';
            trueRadio.name = 'question';
            trueRadio.value = 'true';
            trueRadio.onclick = () => selectAnswer(true);
            trueLabel.appendChild(trueRadio);
            trueLabel.appendChild(document.createTextNode('✅ صح'));
            
            const falseLabel = document.createElement('label');
            const falseRadio = document.createElement('input');
            falseRadio.type = 'radio';
            falseRadio.name = 'question';
            falseRadio.value = 'false';
            falseRadio.onclick = () => selectAnswer(false);
            falseLabel.appendChild(falseRadio);
            falseLabel.appendChild(document.createTextNode('❌ خطأ'));
            
            tfDiv.appendChild(trueLabel);
            tfDiv.appendChild(falseLabel);
            container.appendChild(tfDiv);
        }
        
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TOTAL_TIME;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!isAnswered) {
                    isAnswered = true;
                    currentIndex++;
                    loadQuestion();
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const fill = document.getElementById('timerFill');
        const text = document.getElementById('timerText');
        const percentage = (timeLeft / TOTAL_TIME) * 100;
        fill.style.width = `${Math.max(0, percentage)}%`;
        text.textContent = timeLeft;
        
        if (timeLeft <= 5) {
            text.classList.add('warning');
            fill.style.background = '#e74c3c';
        } else {
            text.classList.remove('warning');
            fill.style.background = '#2b7de9';
        }
    }

    function selectAnswer(selectedValue) {
        if (isAnswered) return;
        isAnswered = true;
        clearInterval(timerInterval);
        
        const q = questions[currentIndex];
        let isCorrect = false;
        
        if (q.type === 'mcq') {
            isCorrect = (selectedValue === q.correct);
        } else {
            isCorrect = (selectedValue === q.correct);
        }
        
        if (isCorrect) score++;
        
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 300);
    }

    // ============================================================
    //  النتيجة
    // ============================================================
    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        
        const total = questions.length;
        const percentage = Math.round((score / total) * 100);
        const name = userName || 'ضيف';
        const place = userPlace || 'غير محدد';
        
        document.getElementById('resultName').textContent = `👋 ${name} من فريق ${place}`;  // <-- تم التعديل
        document.getElementById('resultScore').textContent = `${percentage}%`;
        document.getElementById('resultDetails').textContent = `أجبت بشكل صحيح على ${score} من أصل ${total} سؤال.`;
        
        const icon = document.getElementById('resultIcon');
        const feedback = document.getElementById('resultFeedback');
        const container = document.getElementById('appContainer');
        
        container.classList.remove('celebrate', 'encourage');
        
        if (percentage >= 50) {
            container.classList.add('celebrate');
            icon.textContent = '🎉🏆🎊';
            feedback.textContent = 'ممتاز! مستوى تواصلك رائع، استمر في التميز!';
            launchConfetti();
        } else {
            container.classList.add('encourage');
            icon.textContent = '💪📚😊';
            feedback.textContent = 'لا بأس! هذه فرصة رائعة للتعلم والتطوير، واصل القراءة والممارسة!';
        }
    }

    // ============================================================
    //  كونفيتي
    // ============================================================
    function launchConfetti() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        document.body.appendChild(container);
        
        const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#1abc9c'];
        for (let i = 0; i < 150; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 10 + 6) + 'px';
            piece.style.height = (Math.random() * 10 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
            piece.style.animationDelay = (Math.random() * 2) + 's';
            container.appendChild(piece);
        }
        
        setTimeout(() => {
            if (container.parentNode) container.remove();
        }, 5000);
    }

    // ============================================================
    //  إعادة الاختبار
    // ============================================================
    function restartQuiz() {
        clearInterval(timerInterval);
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('welcomeScreen').classList.add('active');
        document.getElementById('appContainer').classList.remove('celebrate', 'encourage');
        document.querySelectorAll('.confetti-container').forEach(el => el.remove());
        document.getElementById('userName').value = userName;
        document.getElementById('userPlace').value = userPlace;
        currentIndex = 0;
        score = 0;
        isAnswered = false;
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('welcomeScreen').classList.add('active');
    });
</script>
</body>
</html>
